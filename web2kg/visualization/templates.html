<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面模板检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#203e38;font:15px system-ui,sans-serif}header{padding:24px;background:#203e38;color:white}header a{color:#c5eee1}h1{margin:0 0 12px}p{line-height:1.6}main{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:20px}aside,section{background:white;border:1px solid #d5dfdb;border-radius:10px;padding:16px}button,input,select{font:inherit;padding:9px;border:1px solid #b9cdc5;border-radius:5px}button{cursor:pointer;background:white}button.active{background:#d8eee6;border-color:#267563}#groups{display:grid;gap:6px;margin-top:12px;max-height:75vh;overflow:auto}input{width:100%}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{border:1px solid #d5dfdb;padding:12px;border-radius:8px;overflow-wrap:anywhere}.card img{width:100%;height:180px;object-fit:contain;object-position:top;background:#f5f5f5}.muted{font-size:13px;color:#64766f}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;background:#f1f5f4;padding:10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}summary{cursor:pointer;padding:8px}#metrics{font-size:18px}a{color:#216b55}@media(max-width:750px){main{grid-template-columns:1fr}#groups{max-height:220px}}
</style>
<style>
.map-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.map-tools label{font-size:13px}.map-tools input{width:110px}#mapCanvas{height:470px;overflow:auto;border:1px solid #d5dfdb;background:#f7faf8;border-radius:8px}#mapCanvas svg{display:block}.template-node{cursor:pointer}.template-node rect{fill:white;stroke:#9db7a9;stroke-width:1.5}.template-node.active rect{fill:#d8eee6;stroke:#216b55;stroke-width:3}.template-node text{fill:#203e38;font:12px system-ui,sans-serif;pointer-events:none}.template-edge{fill:none;stroke:#8ca99c;stroke-width:1.5;cursor:pointer}.template-edge:hover,.template-edge.selected{stroke:#b26815;stroke-width:3}.function-card{background:#f2f7ee;border:1px solid #d5dfdb;border-radius:8px;padding:14px;margin:12px 0}#edgeInfo{overflow-wrap:anywhere;background:#fff6df;border-radius:6px;padding:12px}#edgeInfo:empty{display:none}#mapSummary{font-size:13px;color:#64766f}.jump{border:0;color:#216b55;text-decoration:underline;padding:0}.edge-table{overflow:auto}iframe{max-width:100%}main>section{min-width:0}@media(max-width:750px){#mapCanvas{height:380px}}
</style>
<style>[data-transition]{cursor:pointer}[data-transition]:hover .template-edge,[data-transition]:focus .template-edge{stroke:#b26815;stroke-width:3}</style>
<header><h1>页面模板检查</h1><div id="metrics"></div><p>模板归纳共同结构；实际交互状态仍逐个保留。归类结果需要人工核验，不代表任务成功或跨站泛化。</p><a href="../../viewer.html">返回原始图谱</a></header>
<main><aside><input id="filter" placeholder="按标题、URL 或模板筛选" aria-label="筛选模板"><div id="groups"></div></aside><section><div id="map"><h2>模板转换图</h2><p class="muted">节点代表模板，箭头代表实际观察到的模板间转换；自环表示模板内跳转。图中连线不保证对每个成员都适用，也不是自动执行流程。</p><div class="map-tools"><label>连线 <select id="mapScope"><option value="focus">当前模板的入边 / 出边</option><option value="all">全部转换</option></select></label><label>缩放 <input id="mapZoom" type="range" min="30" max="160" value="100"></label><button id="mapFit">适应宽度</button></div><div id="mapSummary"></div><div id="mapCanvas"></div><div id="edgeInfo"></div></div><h2 id="title"></h2><div id="functionCard"></div><p id="description"></p><div id="transitions"></div><div id="members" class="cards"></div></section></main>
<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.querySelector('#payload').textContent), $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=data.templates[0]?.id;
let chosenEdge=null;
const cards=data.cards||{}, evidence=data.edge_evidence||{};
$('#metrics').textContent=`${data.summary.nodes} 个状态 → ${data.summary.templates} 个模板 · ${data.summary.cross_url_templates} 个跨 URL 模板 · ${data.summary.local_variants} 个局部状态继承`;
function selectGroup(id){selected=id;chosenEdge=null;list();show()}
function list(){const q=$('#filter').value.toLowerCase();$('#groups').innerHTML=data.templates.filter(g=>(g.id+' '+(cards[g.id]?.name||'')+' '+g.members.map(k=>data.nodes[k].title+' '+data.nodes[k].url).join(' ')).toLowerCase().includes(q)).map(g=>`<button class="${g.id===selected?'active':''}" data-group="${g.id}">${g.id} · ${esc(cards[g.id]?.name||data.nodes[g.representative].title)}<br><small>${g.members.length} 状态 / ${new Set(g.members.map(k=>data.nodes[k].url)).size} URL</small></button>`).join('');$('#groups').querySelectorAll('button').forEach(b=>b.onclick=()=>selectGroup(b.dataset.group))}
function showCard(){const c=cards[selected];$('#functionCard').innerHTML=c?`<div class="function-card"><h3>${esc(c.name)}</h3><p>${esc(c.summary)}</p><details><summary>共同功能、条件分支与未知项</summary><pre>${esc(JSON.stringify({common_functions:c.common_functions,variants:c.variants,uncertainties:c.uncertainties},null,2))}</pre></details><small>历史样本总结，不是当前网页身份、写入权限或任务完成证明。</small></div>`:'<p class="muted">此模板没有通过校验的功能卡；仅展示结构和实际转换。</p>'}
function edgeDetails(e){chosenEdge=e.id;const rows=e.evidence_edges.map(k=>{const r=evidence[k];return r?`<li>${esc(r.action.kind)} / ${esc(r.action.role)} / ${esc(r.action.name)}<br><small>${esc(data.nodes[r.source]?.title)} → ${esc(data.nodes[r.target]?.title)} · ${esc(k)}</small><br><a href="../../snapshots/${encodeURIComponent(r.source)}/page.png" target="_blank" rel="noopener">源截图</a> · <a href="../../snapshots/${encodeURIComponent(r.target)}/page.png" target="_blank" rel="noopener">目标截图</a></li>`:`<li>${esc(k)}</li>`}).join('');$('#edgeInfo').innerHTML=`<strong>${esc(e.source)} → ${esc(e.target)}</strong> · ${e.evidence_edges.length}条实际边<ul>${rows}</ul><details><summary>入边控件结构</summary><pre>${esc(JSON.stringify(e.control,null,2))}</pre></details>`;drawMap()}
function drawMap(){
 const edges=data.transitions.filter(e=>$('#mapScope').value==='all'||e.source===selected||e.target===selected);
 const shown=new Set([selected,...edges.flatMap(e=>[e.source,e.target])]);
 const groups=$('#mapScope').value==='all'?data.templates:data.templates.filter(g=>shown.has(g.id));
 const columns=new Map(),pos=new Map();for(const g of groups){const depth=Math.min(...g.members.map(k=>Number(data.nodes[k].depth)||0));if(!columns.has(depth))columns.set(depth,[]);columns.get(depth).push(g)}
 const levels=[...columns.keys()].sort((a,b)=>a-b);let height=230;levels.forEach((depth,x)=>{const groups=columns.get(depth);height=Math.max(height,groups.length*105+70);groups.forEach((g,y)=>pos.set(g.id,{x:30+x*230,y:35+y*105}))});const width=Math.max(280,levels.length*230+40);
 let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="模板转换图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78998a"/></marker></defs>`;
 for(const [i,e] of edges.entries()){const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)continue;let d;if(e.source===e.target)d=`M${a.x+135} ${a.y} C${a.x+180} ${a.y-32} ${a.x+65} ${a.y-32} ${a.x+105} ${a.y}`;else if(a.x===b.x)d=`M${a.x+178} ${a.y+25} C${a.x+215+(i%3)*5} ${a.y+25} ${b.x+215+(i%3)*5} ${b.y+40} ${b.x+178} ${b.y+40}`;else{const forward=b.x>a.x,sx=a.x+(forward?178:0),tx=b.x+(forward?0:178),bend=(tx-sx)/2;d=`M${sx} ${a.y+30} C${sx+bend} ${a.y+30+(i%3-1)*12} ${tx-bend} ${b.y+30+(i%3-1)*12} ${tx} ${b.y+30}`}
 svg+=`<g data-transition="${e.id}" tabindex="0" role="button" aria-label="${e.source} 到 ${e.target} ${e.evidence_edges.length}条证据"><title>${e.source} → ${e.target} · ${esc(e.control.role)} / ${esc(e.control.kind)} · ${e.evidence_edges.length}条实际边</title><path class="template-edge-hit" d="${d}" fill="none" stroke="transparent" stroke-width="12" pointer-events="stroke"/><path class="template-edge ${chosenEdge===e.id?'selected':''}" d="${d}" marker-end="url(#arrow)"/></g>`;}
 for(const g of groups){const p=pos.get(g.id),name=cards[g.id]?.name||data.nodes[g.representative].title||'未命名';svg+=`<g class="template-node ${g.id===selected?'active':''}" data-template="${g.id}" transform="translate(${p.x} ${p.y})" tabindex="0" role="button" aria-label="${g.id} ${esc(name)}"><rect width="178" height="66" rx="8"/><text x="11" y="20" font-weight="bold">${g.id} · ${esc(name.length>15?name.slice(0,15)+'…':name)}</text><text x="11" y="43">${g.members.length}状态 / ${new Set(g.members.map(k=>data.nodes[k].url)).size} URL${cards[g.id]?' · 有卡':' · 无卡'}</text></g>`;}
 $('#mapCanvas').innerHTML=svg+'</svg>';$('#mapSummary').textContent=`显示${groups.length}/${data.templates.length}个模板 · ${edges.length}/${data.transitions.length}组转换 · 点击节点看功能卡和成员，点击箭头看控件证据`;
 $('#mapCanvas').querySelectorAll('[data-template]').forEach(n=>{n.onclick=()=>selectGroup(n.dataset.template);n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();selectGroup(n.dataset.template)}}});$('#mapCanvas').querySelectorAll('[data-transition]').forEach(n=>{n.onclick=()=>edgeDetails(data.transitions.find(e=>e.id===n.dataset.transition));n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();edgeDetails(data.transitions.find(t=>t.id===n.dataset.transition))}}});scaleMap();
}
function scaleMap(){const svg=$('#mapCanvas svg');if(!svg)return;const box=svg.viewBox.baseVal,z=Number($('#mapZoom').value)/100;svg.style.width=box.width*z+'px';svg.style.height=box.height*z+'px'}
function show(){const g=data.templates.find(g=>g.id===selected);if(!g)return;$('#title').textContent=`${g.id} · ${data.nodes[g.representative].title}`;showCard();$('#edgeInfo').replaceChildren();drawMap();$('#description').textContent=`代表节点 ${g.representative}；${data.parameters.match_rule === "page_structure_threshold" ? `只要求页面结构分 ≥ ${data.parameters.threshold}，父模板和入边不设门槛；加权总分仅排序` : `仅按加权总分阈值 ${data.parameters.threshold} 匹配，无单项最低分`}。父模板 / 入边 / 页面权重 ${Object.values(data.parameters.raw_weights||{parent:1,incoming:1,page:1}).join(" / ")}。页面内计分项 ${Object.entries(data.parameters.page_features).map(([k,v])=>`${({structure:"结构路径",combinations:"父子组合",controls:"控件路径"})[k]||k} ${v}`).join(" / ")}。${data.version === "context-structure-v8" ? "缺少可比父模板或入边时仅按页面分；同分比较核心均分、结构指纹、稳定节点ID并记录歧义。代表在任务中固定，收尾优先选择有真实入边的核心均分最高成员" : "代表固定，避免逐步漂移"}。结构证据不足仅供参考，不参与否决。已观察到的同页局部交互状态继续继承父模板。`;
const edges=data.transitions.filter(e=>e.source===selected);$('#transitions').innerHTML=`<details><summary>从此模板出发的 ${edges.length} 类已观察转换（不保证适用于所有成员）</summary><div class="edge-table"><table><tr><th>目标模板</th><th>控件/动作</th><th>实际边证据</th></tr>${edges.map(e=>`<tr><td>${e.target}</td><td>${esc(e.control.role)} / ${esc(e.control.function||e.control.position||(e.control.anchor_role?e.control.anchor_role+' 相对深度 '+e.control.relative_depth:'局部结构'))} / ${esc(e.control.kind)}</td><td><button class="jump" data-evidence="${e.id}">查看 ${e.evidence_edges.length} 条</button></td></tr>`).join('')}</table></div></details>`;$('#transitions').querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{edgeDetails(data.transitions.find(e=>e.id===b.dataset.evidence));$('#edgeInfo').scrollIntoView({block:'nearest'})});
$('#members').innerHTML=g.members.map(k=>{const n=data.nodes[k],a=data.assignments[k],d=data.decisions.find(x=>x.node===k);return `<article class="card"><a href="../../snapshots/${encodeURIComponent(k)}/page.png" target="_blank" rel="noopener"><img loading="lazy" src="../../snapshots/${encodeURIComponent(k)}/page.png" alt="${esc(n.title)}"></a><strong>${esc(n.title)}</strong><p class="muted">${esc(n.url)}<br>${k}<br>${esc(a.reason)}${data.profiles[k].evidence?.sufficient===false?" · 主体结构证据不足":""} · 父模板 ${a.parent_template||'起点'}</p><details><summary>匹配分数与候选</summary><pre>${esc(JSON.stringify({selected:a.selected_match,candidates:d.candidates.slice(0,5)},null,2))}</pre></details><details><summary>结构、重复条目和交互状态</summary><pre>${esc(JSON.stringify({profile:data.profiles[k],incoming:a.incoming,state:a.state},null,2))}</pre></details></article>`}).join('')}
$('#filter').oninput=list;$('#mapScope').onchange=drawMap;$('#mapZoom').oninput=scaleMap;$('#mapFit').onclick=()=>{const svg=$('#mapCanvas svg');if(!svg)return;$('#mapZoom').value=Math.max(30,Math.min(160,Math.floor(100*$('#mapCanvas').clientWidth/svg.viewBox.baseVal.width)));scaleMap()};list();show();$('#mapFit').click();
</script></html>
