<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reddit · 执行轨迹</title>
<style>
:root{--paper:#f5f6f0;--ink:#19352f;--green:#23624b;--line:#dce4dc;--muted:#687870}*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--green)}button,select,input{font:inherit}button,summary{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b98927;outline-offset:3px}
header{padding:19px 30px;border-bottom:1px solid var(--line);background:white;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{font-size:20px}header span{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1500px;margin:auto}aside{padding:24px 20px;position:sticky;top:0;height:100vh;overflow:auto}main{min-width:0;padding:28px 32px 80px}h1{font-size:28px;margin:0 0 14px}h2{font-size:20px;margin:28px 0 14px}h3{font-size:16px;margin:10px 0}p{margin:8px 0}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 Consolas,"Microsoft YaHei",monospace}code{overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}.note{padding:13px 17px;background:#fff2d6;border-radius:8px;font-size:13px;margin:15px 0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.tasklink{display:flex;justify-content:space-between;text-decoration:none;border-radius:7px;padding:9px 12px;margin:5px 0}.tasklink:hover,.tasklink.active{background:#dfeadd}.good{color:#23624b}.bad{color:#ae382e}.badge{font-size:12px;border-radius:20px;background:#eef2eb;padding:3px 10px;white-space:nowrap}.task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.task-grid a{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;text-decoration:none}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0}button,select{border:1px solid #bdcec2;border-radius:6px;padding:6px 12px;background:white;color:var(--green)}button[aria-pressed=true]{background:var(--green);color:white}.step{background:white;border:1px solid var(--line);border-radius:12px;margin:14px 0;scroll-margin:12px}.step>summary{display:flex;gap:14px;align-items:center;padding:17px 20px;list-style:none}.step>summary:before{content:'▸';color:var(--green)}.step[open]>summary:before{content:'▾'}.step-title{min-width:0;flex:1}.step-title code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}.step-body{border-top:1px solid var(--line);padding:20px}.urls{font-size:12px;overflow-wrap:anywhere;color:var(--muted)}.action{background:#eaf2e6;border-left:3px solid var(--green);padding:14px;margin:14px 0}.panels{min-width:0}.panel{margin:12px 0}.panel[hidden]{display:none}.fold{border:1px solid var(--line);border-radius:7px;margin:10px 0}.fold>summary{padding:10px 14px;font-weight:600}.fold-body{padding:0 14px 14px}.text-box{max-height:580px;overflow:auto;background:#f5f7f3;padding:14px;border:1px solid var(--line);border-radius:7px}.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.imagebox{margin:0;min-width:0}.imagebox img{width:100%;height:auto;display:block;cursor:zoom-in}.image-scroll{max-height:660px;overflow:auto;border:1px solid var(--line);background:white}.imagebox figcaption{font-size:12px;color:var(--muted);margin:6px 0}.ax-search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}mark{background:#ffe39c}.navsteps{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0}.navsteps a{padding:4px 9px;background:white;border:1px solid var(--line);border-radius:4px;text-decoration:none}.source{overflow-wrap:anywhere;font-size:12px;color:var(--muted)}dialog{width:95vw;max-width:1500px;height:94vh;border:1px solid var(--line);border-radius:10px;padding:15px}dialog::backdrop{background:#152b26aa}.zoomscroll{height:calc(100% - 58px);overflow:auto;margin-top:12px}.zoomscroll img{max-width:100%;height:auto}.zoomscroll.native img{max-width:none}.empty{padding:20px;background:#f5f7f3;border-radius:8px;color:var(--muted)}
@media(max-width:800px){.layout{display:block}aside{position:static;height:auto;padding:10px 16px;border-bottom:1px solid var(--line)}#menu{display:flex;overflow:auto}.tasklink{white-space:nowrap;gap:12px}aside>p{display:none}main{padding:22px 16px}header{padding:15px 16px}.images{grid-template-columns:1fr}.step-body{padding:14px}.step>summary{padding:14px}.toolbar button{font-size:13px}}
</style>
<header><strong>web2kg / 执行轨迹</strong><span>离线日志 · 逐步核验</span><a href="__RESULTS_HREF__" id="results">成绩汇总 ↗</a></header>
<div class="layout"><aside><a href="index.html" id="allTasks">全部任务</a><nav id="menu"></nav><p class="muted">每题取最后一次实际运行。保留来源，不把补测写成一次运行。</p></aside><main id="main"></main></div>
<dialog id="zoom"><button id="close">关闭</button> <button id="scale">原尺寸 / 适合宽度</button><div class="zoomscroll"><img alt="截图放大查看"></div></dialog>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('payload').textContent),main=document.getElementById('main');
document.getElementById('allTasks').textContent=`全部${data.menu.length}题`;
const labels={plan:'计划',extract_constraints:'任务约束',interaction_history_summary:'历史回顾',observation_description:'页面描述',mode_analysis:'模式判断',reason:'行动理由',note:'跨轮笔记（动作前记录）',navigate_think:'导航说明',navigate_query:'检索文本',target_page:'选择页面',page_selection_response:'页面选择回复',topk_webpages:'Top-k候选'};
const value=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function add(parent,tag,text,cls){const n=el(tag,text,cls);parent.append(n);return n;}
function textBox(parent,text){const wrap=add(parent,'div',undefined,'text-box');add(wrap,'pre',text===null||text===undefined?'未保存':value(text));return wrap;}
function fold(parent,title,text,open=false){const d=add(parent,'details',undefined,'fold');d.open=open;add(d,'summary',title);const b=add(d,'div',undefined,'fold-body');if(text!==undefined)textBox(b,text);return b;}
function state(score){return score===1?'成功':score===0?'失败':'未评分';}
function picture(parent,path,caption){if(!path){add(parent,'div',caption+'：未保存','empty');return;}const f=add(parent,'figure',undefined,'imagebox'),wrap=add(f,'div',undefined,'image-scroll'),im=add(wrap,'img');im.src=path;im.loading='lazy';im.alt=caption;im.onclick=()=>{const d=document.getElementById('zoom');d.querySelector('img').src=path;d.querySelector('.zoomscroll').classList.remove('native');d.showModal();};add(f,'figcaption',caption+' · 点击放大');}
function searchable(parent,text){const input=add(parent,'input',undefined,'ax-search');input.placeholder='查找控件编号或文字，例如 Subscribe';input.setAttribute('aria-label','在可访问性树中查找');const box=textBox(parent,text),pre=box.firstChild;input.oninput=()=>{pre.replaceChildren();const s=text||'未保存',q=input.value;if(!q){pre.textContent=s;return;}let start=0,at;const lower=s.toLowerCase();while((at=lower.indexOf(q.toLowerCase(),start))>=0){pre.append(document.createTextNode(s.slice(start,at)));add(pre,'mark',s.slice(at,at+q.length));start=at+q.length;}pre.append(document.createTextNode(s.slice(start)));const hit=pre.querySelector('mark');if(hit)box.scrollTop=hit.offsetTop-pre.offsetTop;};}
for(const t of data.menu){const a=add(document.getElementById('menu'),'a',undefined,'tasklink'+(data.task?.id===t.id?' active':''));a.href=`task-${t.id}.html`;add(a,'span','任务 '+t.id);add(a,'span',state(t.score),t.score===1?'good':'bad');}
const zoom=document.getElementById('zoom');document.getElementById('close').onclick=()=>zoom.close();document.getElementById('scale').onclick=()=>zoom.querySelector('.zoomscroll').classList.toggle('native');
if(!data.task){
 add(main,'h1',`${data.menu.length}条执行轨迹`);add(main,'p',`${data.menu.filter(t=>t.score===1).length}题成功，${data.menu.filter(t=>t.score===0).length}题失败，${data.menu.filter(t=>t.score!==0&&t.score!==1).length}题未评分。点击任务进入逐步查看。`);
 add(main,'p','每步包含已记录的模型说明、实际动作、动作前后截图、实际请求AX与保存AX。重试、页面选择和导航记录也可展开。SoM仅展示已保存且有对应证据的标注图。','note');
 const grid=add(main,'div',undefined,'task-grid');for(const t of data.menu){const a=add(grid,'a');a.href=`task-${t.id}.html`;add(a,'h2','任务 '+t.id);add(a,'strong',state(t.score),t.score===1?'good':'bad');add(a,'p',t.source,'source');}
}else{
 const t=data.task;document.title=`任务 ${t.id} · 执行轨迹`;
 add(main,'h1',`任务 ${t.id} · ${state(t.score)}`);add(main,'p',t.objective);add(main,'p',`来源：${t.folder} · ${t.steps.length}个实际Agent步骤`,'source');
 add(main,'p','“思考”展示的是日志中模型公开输出的计划和行动理由，不是未记录的内部推理。截图为执行时保存的页面，送模时可能另有缩放/编码。导航内部点击与Agent步数分开。','note');
 const history=fold(main,'实验来源与历史结果');for(const h of t.history)add(history,'p',`${h.source}：${h.status==='not_started'?'未运行':state(h.score)}`,'source');
 const toolbar=add(main,'div',undefined,'toolbar'),open=add(toolbar,'button','展开所有步骤'),close=add(toolbar,'button','收起所有步骤');open.onclick=()=>document.querySelectorAll('details.step').forEach(d=>{d.open=true;d.dispatchEvent(new Event('toggle'));});close.onclick=()=>document.querySelectorAll('details.step').forEach(d=>d.open=false);
 const nav=add(main,'div',undefined,'navsteps');for(const s of t.steps){const a=add(nav,'a',s.number);a.href='#step-'+s.number;a.onclick=()=>{const d=document.getElementById('step-'+s.number);d.open=true;};}
 for(const s of t.steps){
  const d=add(main,'details',undefined,'step');d.id='step-'+s.number;const sum=add(d,'summary');add(sum,'span',`S${s.number}`,'badge');const title=add(sum,'div',undefined,'step-title');add(title,'strong',s.action.split(' ')[0]);add(title,'code',s.action);add(sum,'span',`${s.calls.length}次调用`,'badge');
  let built=false;d.addEventListener('toggle',()=>{if(!d.open||built)return;built=true;
   const body=add(d,'div',undefined,'step-body');add(body,'p','前：'+s.before_url,'urls');add(body,'p','后：'+s.after_url,'urls');const action=add(body,'details',undefined,'action');action.open=s.action.length<240;add(action,'summary','实际行动'+(s.action.length>=240?'（展开完整参数）':''));add(action,'pre',s.action);
   const tabs=add(body,'div',undefined,'toolbar'),panels=add(body,'div',undefined,'panels');
   function panel(name){const button=add(tabs,'button',name);button.setAttribute('aria-pressed','false');const p=add(panels,'section',undefined,'panel');p.hidden=true;button.onclick=()=>{for(const x of panels.children)x.hidden=true;for(const x of tabs.children)x.setAttribute('aria-pressed','false');p.hidden=false;button.setAttribute('aria-pressed','true');};return [p,button];}
   const [thinking,first]=panel('思考与行动');for(const [k,v] of Object.entries(s.notes))fold(thinking,labels[k]||k,v,['reason','mode_analysis','note'].includes(k));if(!Object.keys(s.notes).length)add(thinking,'p','没有记录模型说明。');
   const [screens]=panel('截图');add(screens,'p',`左/上为动作前 step-${s.number-1}.png，右/下为动作后 ${s.after_file||`step-${s.number}.png`}；发生恢复时保留返回前的真实结果。`,'muted');const images=add(screens,'div',undefined,'images');picture(images,s.before,'动作前');picture(images,s.after,'动作后');
   const [ax]=panel('可访问性树');const actors=s.calls.filter(c=>c.purpose==='original_actor');add(ax,'p','实际请求AX来自当次original_actor输入；保存AX来自步骤txt。两者可能因结构优化和截断而不同。','muted');
   if(actors.length){for(const [i,c] of actors.entries()){const b=fold(ax,`实际请求AX ${i+1} · ${c.ax===null?'未保存':c.ax.split('\n').length+'行'} · ${c.id}`,undefined,i===actors.length-1);searchable(b,c.ax);}}
   else add(ax,'p','未找到对应Actor请求，不能把轨迹树当作实际送模内容。','empty');
   searchable(fold(ax,`保存AX · ${s.raw_ax===null?'未保存':s.raw_ax.split('\n').length+'行'} · step-${s.number-1}.txt`),s.raw_ax);searchable(fold(ax,'轨迹记录的优化AX（可能尚未经过请求裁剪）'),s.trajectory_ax);
   const [som]=panel('SoM');if(s.som){add(som,'p','保存快照与本步动作前截图的可见区域逐像素一致。编号是快照候选序号，不等于AX控件ID；此图用于人工核验，不代表送给模型的图片。','note');picture(som,s.som.image,s.som.source);}else add(som,'p','本步未保存可可靠对应的SoM。未使用其他时刻或仅URL相同的标注图替代。页面底部仍可查看导航/结束时保存的SoM快照。','empty');
   const [api]=panel('模型回复与重试');for(const c of s.calls){const b=fold(api,`${c.purpose} · 调用${c.call} · ${c.id}`,undefined);if(c.http_status)add(b,'p',`HTTP ${c.http_status} ${c.error_code||''}`,'bad');if(!c.output.length)add(b,'p','未保存可见模型回复。');for(const m of c.output){add(b,'h3',`${m.phase||'未标注阶段'} / ${m.status||'未标注状态'}`);textBox(b,m.text||'（空文本）');}for(const context of c.context)fold(b,'当次模板 / 全局框架 / 恢复与经验上下文',context);}
   if(s.events.length)fold(api,'导航、重试与回退事件（字段摘要）',s.events,true);first.click();
  });
  if(s.number===1)d.open=true;
 }
 const gallery=fold(main,'导航 / 结束状态SoM快照（不强配到普通动作步骤）');add(gallery,'p','这些是实际保存的标注图。同状态ID的文件可能被后续观察覆盖，因此仅标明保存位置，不宣称其代表每次经过该状态的瞬间。编号不是AX ID。','note');
 for(const snap of t.snapshots){const b=fold(gallery,snap.title||snap.source);add(b,'p',snap.source,'source');add(b,'p',snap.url,'urls');picture(b,snap.image,'保存的SoM');}
 fold(main,'最终答复（不是评分器答案）',t.answer,true);if(t.unassigned_calls.length)fold(main,'未对应已执行动作的后续调用',t.unassigned_calls);
 if(location.hash.startsWith('#step-')){const d=document.querySelector(location.hash);if(d)d.open=true;}
}
</script></html>
