[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web2kg"
version = "0.1.0"
description = "A bounded interaction graph and retrieval-assisted Web Agent prototype"
requires-python = ">=3.11"
dependencies = ["playwright>=1.44,<2", "requests>=2.31", "python-dotenv>=1", "numpy>=1.24", "scipy>=1.10,<2", "scikit-learn>=1.2,<2", "threadpoolctl>=3.6", "Markdown>=3.5", "jsonschema>=4.18,<5", "PyYAML>=6,<7", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
web2kg = "web2kg.cli:main"

[tool.setuptools.package-data]
"web2kg.common" = ["annotate.js", "page_content.js"]
"web2kg.visualization" = ["viewer.html", "manual.html", "control.html", "templates.html", "trajectories.html"]

[tool.setuptools.packages.find]
include = ["web2kg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
